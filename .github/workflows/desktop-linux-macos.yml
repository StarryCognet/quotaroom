name: Desktop Linux / macOS

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          cache: true

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libx11-dev \
            libxi-dev \
            libsecret-1-dev \
            libnotify-dev \
            libsqlite3-dev \
            libayatana-appindicator3-dev

      - name: Dependencies
        run: flutter pub get

      - name: Analyze and test
        run: |
          flutter analyze
          flutter test

      - name: Build Linux desktop
        run: flutter build linux --release

      - name: Package Linux bundle
        run: |
          mkdir -p dist
          tar -czf dist/QuotaRoom-linux-x64.tar.gz \
            -C build/linux/x64/release/bundle .
          cd dist
          sha256sum *.tar.gz > SHA256SUMS-linux.txt

      - uses: actions/upload-artifact@v4
        with:
          name: QuotaRoom-linux-x64
          path: dist/*

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Analyze and test
        run: |
          flutter analyze
          flutter test

      - name: Build macOS desktop
        run: flutter build macos --release

      - name: Package macOS app
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent \
            "build/macos/Build/Products/Release/QuotaRoom.app" \
            "dist/QuotaRoom-macos.zip"
          cd dist
          shasum -a 256 *.zip > SHA256SUMS-macos.txt

      - uses: actions/upload-artifact@v4
        with:
          name: QuotaRoom-macos
          path: dist/*
